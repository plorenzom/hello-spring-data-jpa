# Paquetes a revisar en busca de clases anotadas como componentes.
# Un componente es un objeto cuyo ciclo de vida está gestionado por Spring IoC.
app.component.packages-to-scan=es.thefactory.hellospringdatajpa

# Ruta del fichero SQL que contiene la definición del esquema de base de datos.
jpa.datasource.schema-location=sql/schema.sql

# Paquetes a revisar en busca de clases anotadas como entidades JPA.
jpa.entity.packages-to-scan=es.thefactory.hellospringdatajpa.dal.entity

# Paquetes a revisar en busca de interfaces anotadas como repositorios JPA.
jpa.repository.packages-to-scan=es.thefactory.hellospringdatajpa.dal.repo
